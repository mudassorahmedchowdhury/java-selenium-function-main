<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Buttons fixture</title></head>
<body>
<div id="result"></div>
<button id="save" onclick="r('save')">Save</button>
<button id="a1" onclick="r('dup1')">Duplicate</button>
<button id="a2" onclick="r('dup2')">Duplicate</button>
<button id="quote" onclick="r('quote')">Say "hi" it's</button>
<input id="submit" type="submit" value="Send" onclick="r('send'); return false;">
<button id="cased" onclick="r('cased')">  Mixed   Case </button>
<div style="position:relative;display:inline-block">
  <button id="covered" onclick="r('covered')">Covered</button>
  <div style="position:absolute;left:0;top:0;width:100%;height:100%;z-index:10"></div>
</div>

<div id="dialog" class="any-dialog"><button id="d-ok" onclick="r('dialog-ok')">OK</button></div>
<div id="hidden-dialog" style="display:none"><button onclick="r('x')">OK</button></div>

<iframe id="frame" srcdoc="<button onclick=&quot;parent.r('frame-ok')&quot;>Confirm</button>"></iframe>
<script>function r(v){document.getElementById('result').textContent=v;}</script>
</body>
</html>
