<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Forms fixture</title></head>
<body>
<input id="name" type="text" value="initial">
<input id="readonly" type="text" value="locked" readonly>
<input id="disabled-text" type="text" value="off" disabled>
<textarea id="notes"></textarea>
<input id="hidden-text" type="text" style="display:none">

<select id="country">
  <option value="">Choose</option>
  <option value="bd">Bangladesh</option>
  <option value="us">United States</option>
</select>
<select id="disabled-select" disabled><option>One</option></select>
<div id="not-select">plain div</div>

<label><input id="terms" type="checkbox"> Terms</label>
<label><input id="news" type="checkbox" checked> Newsletter</label>
<input id="disabled-check" type="checkbox" disabled>
<input id="hidden-check" type="checkbox" style="display:none">
<label><input id="red" type="radio" name="color" value="red"> Red</label>
<label><input id="blue" type="radio" name="color" value="blue" checked> Blue</label>
</body>
</html>
