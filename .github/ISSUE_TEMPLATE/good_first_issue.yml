name: Good first issue (maintainers)
description: A small, well-scoped task for newcomers
labels: [good first issue]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs doing
    validations:
      required: true
  - type: textarea
    id: hints
    attributes:
      label: Where to start
      description: Files/classes and a similar existing example
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      value: |
        - [ ] Implementation
        - [ ] Tests
        - [ ] Javadoc
        - [ ] `mvn clean verify` passes
